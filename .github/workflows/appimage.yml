name: Build AppImage

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    outputs:
      tag: ${{ steps.package.outputs.tag }}
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils libfontconfig1-dev squashfs-tools zsync
          rustup toolchain install 1.99.1 --profile minimal
          rustup default 1.99.1
      - name: Test and build
        run: |
          cargo test --release --locked
          cargo build --release --locked
          desktop-file-validate packaging/battery-life.desktop
      - name: Package AppImage
        id: package
        env:
          ARCH: x86_64
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: |
          install -Dm755 target/release/battery-life AppDir/usr/bin/battery-life
          install -Dm755 packaging/AppRun AppDir/AppRun
          install -Dm644 packaging/battery-life.desktop AppDir/battery-life.desktop
          install -Dm644 packaging/battery-life.svg AppDir/battery-life.svg
          install -Dm644 -t AppDir/usr/share/battery-life/icons/hicolor/scalable/status packaging/tray-icons/hicolor/scalable/status/*.svg
          install -Dm644 LICENSE AppDir/usr/share/doc/battery-life/LICENSE
          ln -s battery-life.svg AppDir/.DirIcon
          curl --fail --location --retry 3 \
            https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage \
            --output "$RUNNER_TEMP/appimagetool"
          printf '%s  %s\n' 'ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0' "$RUNNER_TEMP/appimagetool" | sha256sum --check
          chmod +x "$RUNNER_TEMP/appimagetool"
          mkdir -p dist
          version=$(target/release/battery-life --version)
          appimage=dist/Battery-Life-x86_64.AppImage
          update_info="gh-releases-zsync|${GITHUB_REPOSITORY%/*}|${GITHUB_REPOSITORY#*/}|latest|${appimage##*/}.zsync"
          file_url="https://github.com/$GITHUB_REPOSITORY/releases/download/v$version/${appimage##*/}"
          (
            cd dist
            "$RUNNER_TEMP/appimagetool" --no-appstream --updateinformation "$update_info" \
              --file-url "$file_url" ../AppDir "${appimage##*/}"
          )
          test "$("$appimage" --version)" = "$version"
          test "$(env -u APPIMAGE_EXTRACT_AND_RUN "$appimage" --appimage-updateinformation)" = "$update_info"
          appimage_sha1=$(sha1sum "$appimage" | cut -d ' ' -f 1)
          grep -aFxq "URL: $file_url" "$appimage.zsync"
          grep -aFxq "SHA-1: $appimage_sha1" "$appimage.zsync"
          printf 'tag=v%s\n' "$version" >> "$GITHUB_OUTPUT"
          dist/Battery-Life-x86_64.AppImage --print-udev-rules | diff - packaging/70-battery-life.rules
          dist/Battery-Life-x86_64.AppImage --once | python3 -c 'import json, sys; rows = json.load(sys.stdin)["devices"]; assert {"zaopin", "logitech", "8bitdo", "ciy", "mchose"} <= {row["id"] for row in rows}'
          (cd dist && sha256sum Battery-Life-x86_64.AppImage > Battery-Life-x86_64.AppImage.sha256)
      - name: Upload AppImage, update metadata and checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Battery-Life-x86_64
          path: dist/
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: appimage
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ needs.appimage.outputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download tested AppImage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: Battery-Life-x86_64
          path: dist
      - name: Publish new version
        shell: bash
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.appimage.outputs.tag }}
        run: |
          sha256sum --check Battery-Life-x86_64.AppImage.sha256

          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft' 2>/dev/null); then
            if [[ "$draft" == 'false' ]]; then
              echo "Release $RELEASE_TAG is already published."
              exit 0
            fi
            echo "A draft release already exists for $RELEASE_TAG." >&2
            exit 1
          fi

          tag_exists=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" |
            jq -r --arg ref "refs/tags/$RELEASE_TAG" 'any(.[]; .ref == $ref)')
          tag_options=(--target "$GITHUB_SHA")
          if [[ "$tag_exists" == 'true' ]]; then
            tagged_commit=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq '.sha')
            if [[ "$tagged_commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $RELEASE_TAG points to a different commit." >&2
              exit 1
            fi
            tag_options=(--verify-tag)
          fi

          gh release create "$RELEASE_TAG" "${tag_options[@]}" \
            --title "Battery Life $RELEASE_TAG" --generate-notes \
            Battery-Life-x86_64.AppImage Battery-Life-x86_64.AppImage.sha256 \
            Battery-Life-x86_64.AppImage.zsync
