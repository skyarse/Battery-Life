[package]
name = "battery-life"
version = "0.1.7"
edition = "2024"
license = "AGPL-3.0-only"
description = "Wireless device batteries in the KDE system tray"
repository = "https://github.com/skyarse/Battery-Life"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }
ksni = { version = "0.3.7", features = ["blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit-wayland", "renderer-software", "compat-1-18"] }
zbus = "5"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
